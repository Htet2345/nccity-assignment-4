<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Storyline — a simple responsive blogging website.">
  <title>Storyline | Latest Posts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <header class="site-header">
    <nav class="navbar wrapper" aria-label="Main navigation">
      <a class="brand" href="index.html"><span>Story</span>line</a>
      <div class="nav-actions" id="navActions"></div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="wrapper hero-inner">
        <p class="eyebrow">Thoughts, stories and ideas</p>
        <h1>Discover something<br>worth reading.</h1>
        <p class="hero-copy">Fresh perspectives from independent writers, creators and curious minds.</p>
        <a class="button button-primary" href="#latest">Explore latest posts</a>
      </div>
    </section>

    <section class="posts-section wrapper" id="latest">
      <div class="section-heading">
        <div>
          <p class="eyebrow">The journal</p>
          <h2>Latest posts</h2>
        </div>
        <label class="search-box">
          <span class="sr-only">Search posts</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
          <input id="postSearch" type="search" placeholder="Search posts">
        </label>
      </div>

      <div class="status" id="pageStatus">Loading the latest stories…</div>
      <div class="post-grid" id="postGrid" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <div class="wrapper footer-inner">
      <a class="brand brand-light" href="index.html"><span>Story</span>line</a>
      <p>Made for Assignment 4 · <span id="year"></span></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
